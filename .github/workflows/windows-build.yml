name: Native Stage 5 - Windows x64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-stage5:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and publish Stage 5 source files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'source_bundle/stage5-sources.tar.gz.b64'
          if (Test-Path $bundle) {
            @'
          import base64, io, pathlib, tarfile
          b64 = pathlib.Path('source_bundle/stage5-sources.tar.gz.b64').read_text()
          with tarfile.open(fileobj=io.BytesIO(base64.b64decode(b64)), mode='r:gz') as archive:
              for member in archive.getmembers():
                  if not member.isfile() or member.name == 'README.md':
                      continue
                  relative = pathlib.PurePosixPath(member.name)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise ValueError(f'Unsafe archive path: {member.name}')
                  target = pathlib.Path(*relative.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.extractfile(member).read())
          '@ | python -
            if ($LASTEXITCODE -ne 0) { throw 'Stage 5 source extraction failed' }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add CMakeLists.txt Stage5-Readme.md Build-Stage5.ps1 NativeCameraCore NativeCameraDiscovery NativeCameraOwner NativeCameraCapabilities NativeRuntimeTest Tests
            git rm -- source_bundle/stage5-sources.tar.gz.b64
            git commit -m 'Import complete Stage 5 native C++ source'
            if ($LASTEXITCODE -ne 0) { throw 'Source commit failed' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Source publication failed' }
          }
      - name: Configure CMake x64
        run: cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64
      - name: Compile native DLL, loader, and tests
        run: cmake --build build-windows --config Release --parallel 4
      - name: Run native tests
        run: ctest --test-dir build-windows -C Release --output-on-failure
      - name: Stage binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force Stage5-Windows-Run | Out-Null
          Copy-Item build-windows/NativeRuntimeTest/Release/FH3NativeCameraLoader.exe Stage5-Windows-Run/ -ErrorAction Stop
          Copy-Item build-windows/NativeRuntimeTest/Release/FH3NativeCameraTest.dll Stage5-Windows-Run/ -ErrorAction Stop
          Copy-Item Stage5-Readme.md Stage5-Windows-Run/README.md
          Compress-Archive -Path Stage5-Windows-Run/* -DestinationPath FH3NativeCameraStage5-Win64.zip -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FH3-Native-Camera-Stage5-Win64
          path: Stage5-Windows-Run/
          if-no-files-found: error
          retention-days: 90
      - name: Publish experimental prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'stage5-experimental-' + '${{ github.run_number }}'
          gh release create $tag FH3NativeCameraStage5-Win64.zip Stage5-Windows-Run/FH3NativeCameraLoader.exe Stage5-Windows-Run/FH3NativeCameraTest.dll Stage5-Windows-Run/README.md --title "Stage 5 experimental Windows x64 (${{ github.run_number }})" --notes "Experimental native camera activation ONLY. Not the finished debug menu. Compiled and unit-tested in GitHub Actions; untested in-game. Exact retail build hash required; the hook may crash. No RTSS dependency." --prerelease --target (git rev-parse HEAD).Trim()
