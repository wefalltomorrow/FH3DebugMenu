name: Native Stage 5 - Windows x64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-stage5:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake x64
        run: cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64
      - name: Compile native DLL, loader, and tests
        run: cmake --build build-windows --config Release --parallel 4
      - name: Run native tests
        run: ctest --test-dir build-windows -C Release --output-on-failure
      - name: Stage binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force Stage5-Windows-Run | Out-Null
          Copy-Item build-windows/NativeRuntimeTest/Release/FH3NativeCameraLoader.exe Stage5-Windows-Run/ -ErrorAction Stop
          Copy-Item build-windows/NativeRuntimeTest/Release/FH3NativeCameraTest.dll Stage5-Windows-Run/ -ErrorAction Stop
          Copy-Item Stage5-Readme.md Stage5-Windows-Run/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: FH3-Native-Camera-Stage5-Win64
          path: Stage5-Windows-Run/
          if-no-files-found: error
          retention-days: 90
      - name: Publish experimental prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'stage5-experimental-' + '${{ github.run_number }}'
          gh release create $tag Stage5-Windows-Run/FH3NativeCameraLoader.exe Stage5-Windows-Run/FH3NativeCameraTest.dll Stage5-Windows-Run/README.md --title "Stage 5 experimental Windows x64 (${{ github.run_number }})" --notes "Experimental native camera activation ONLY. Not the finished debug menu. Compiled and unit-tested in GitHub Actions; untested in-game. Exact retail build hash required; the hook may crash. No RTSS dependency." --prerelease --target '${{ github.sha }}'
