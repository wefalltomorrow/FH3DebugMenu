name: FH3 Camera Stage 10 - Windows x64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-stage10:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake x64
        run: cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64
      - name: Compile camera tools and tests
        run: cmake --build build-windows --config Release --parallel 4
      - name: Run native tests
        run: ctest --test-dir build-windows -C Release --output-on-failure --verbose
      - name: Stage binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force Stage10-Windows-Run | Out-Null
          Copy-Item build-windows/NativeRuntimeTest/Release/FH3NativeCameraLoader.exe Stage10-Windows-Run/ -ErrorAction Stop
          Copy-Item build-windows/NativeRuntimeTest/Release/FH3NativeCameraTest.dll Stage10-Windows-Run/ -ErrorAction Stop
          Copy-Item build-windows/NativeRuntimeTest/Release/FH3NativeLoadProbe.dll Stage10-Windows-Run/ -ErrorAction Stop
          Copy-Item build-windows/NativeExternalCamera/Release/FH3ExternalCamera.exe Stage10-Windows-Run/ -ErrorAction Stop
          Copy-Item build-windows/NativeCameraTrace/Release/FH3CameraTrace.exe Stage10-Windows-Run/ -ErrorAction Stop
          Copy-Item build-windows/NativeUpdateProbe/Release/FH3UpdateProbe.exe Stage10-Windows-Run/ -ErrorAction Stop
          Copy-Item Stage10-Readme.md Stage10-Windows-Run/README.md
          Copy-Item Stage9-Readme.md Stage10-Windows-Run/STAGE9-README.md
          Copy-Item Stage8-Readme.md Stage10-Windows-Run/STAGE8-README.md
          Copy-Item Stage5-Readme.md Stage10-Windows-Run/STAGE5-README.md
          Copy-Item Stage6-Readme.md Stage10-Windows-Run/STAGE6-README.md
          Copy-Item Stage7-Readme.md Stage10-Windows-Run/STAGE7-README.md
          Compress-Archive -Path Stage10-Windows-Run/* -DestinationPath FH3CameraResearchStage10-Win64.zip -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FH3-Native-Camera-Stage10-Win64
          path: Stage10-Windows-Run/
          if-no-files-found: error
          retention-days: 90
      - name: Publish experimental prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'stage10-experimental-' + '${{ github.run_number }}'
          gh release create $tag FH3CameraResearchStage10-Win64.zip Stage10-Windows-Run/FH3CameraTrace.exe Stage10-Windows-Run/README.md --title "Stage 10 experimental read-only camera mode recorder Windows x64 (${{ github.run_number }})" --notes-file Stage10-Readme.md --prerelease --target (git rev-parse HEAD).Trim()
