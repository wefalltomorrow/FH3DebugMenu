name: FH3 Camera Stage 7 - Windows x64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-stage7:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake x64
        run: cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64
      - name: Compile camera tools and tests
        run: cmake --build build-windows --config Release --parallel 4
      - name: Run native tests
        run: ctest --test-dir build-windows -C Release --output-on-failure
      - name: Stage binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force Stage7-Windows-Run | Out-Null
          Copy-Item build-windows/NativeRuntimeTest/Release/FH3NativeCameraLoader.exe Stage7-Windows-Run/ -ErrorAction Stop
          Copy-Item build-windows/NativeRuntimeTest/Release/FH3NativeCameraTest.dll Stage7-Windows-Run/ -ErrorAction Stop
          Copy-Item build-windows/NativeRuntimeTest/Release/FH3NativeLoadProbe.dll Stage7-Windows-Run/ -ErrorAction Stop
          Copy-Item build-windows/NativeExternalCamera/Release/FH3ExternalCamera.exe Stage7-Windows-Run/ -ErrorAction Stop
          Copy-Item build-windows/NativeCameraTrace/Release/FH3CameraTrace.exe Stage7-Windows-Run/ -ErrorAction Stop
          Copy-Item Stage5-Readme.md Stage7-Windows-Run/README.md
          Copy-Item Stage6-Readme.md Stage7-Windows-Run/STAGE6-README.md
          Copy-Item Stage7-Readme.md Stage7-Windows-Run/STAGE7-README.md
          Compress-Archive -Path Stage7-Windows-Run/* -DestinationPath FH3CameraResearchStage7-Win64.zip -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FH3-Native-Camera-Stage7-Win64
          path: Stage7-Windows-Run/
          if-no-files-found: error
          retention-days: 90
      - name: Publish experimental prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'stage7-experimental-' + '${{ github.run_number }}'
          gh release create $tag FH3CameraResearchStage7-Win64.zip Stage7-Windows-Run/FH3NativeCameraLoader.exe Stage7-Windows-Run/FH3NativeCameraTest.dll Stage7-Windows-Run/FH3NativeLoadProbe.dll Stage7-Windows-Run/FH3ExternalCamera.exe Stage7-Windows-Run/FH3CameraTrace.exe Stage7-Windows-Run/README.md Stage7-Windows-Run/STAGE6-README.md Stage7-Windows-Run/STAGE7-README.md --title "Stage 7 read-only camera state tracing Windows x64 (${{ github.run_number }})" --notes "Stage 7 adds FH3CameraTrace.exe (read-only camera state capture: --inspect or --record 30). The older Stage 6 and Stage 5 tools remain experimental. All code is compiled by Windows CI. No RTSS. Read STAGE7-README.md." --prerelease --target (git rev-parse HEAD).Trim()
